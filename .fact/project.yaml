name: fact
repositories:
  - full_name: Kahncode/fact
    role: factory
task_source:
  kind: github
  repo: Kahncode/fact
# A task is approved when a person labels its issue `fact:ready`, so no plan approval gate on top of that.
require_plan_approval: false
workflows:
  default: standard
# Paths whose change needs a person's review, whatever the classifier says (`classify_signals`).
classify:
  schema_paths:
    - core/migrations/**
  api_paths:
    - api/openapi.json
  always_review_paths:
    - .fact/**
    - .github/**
auto_merge: true
merge_method: squash
