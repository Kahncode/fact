name: fact
repositories:
  - full_name: Kahncode/fact
    role: factory
task_source:
  kind: github
  repo: Kahncode/fact
# A task is approved when a person labels its issue `fact:ready`, so no plan approval gate on top of that.
require_plan_approval: false
workflows:
  default: standard
# Before 1.0 fact makes broad breaking changes all the time (AGENTS.md: no backwards compatibility), so no path
# forces a review: schema, API, SDK, workflow and CI changes go through the classify session like any other code,
# and `.fact/prompts/classify.md` tells it they (and the CLI bootstrapping: `fact dev`, `use`, `--follow`, `shutdown`)
# are not high risk or one-way doors. Restore the globs and that rule at 1.0.
classify:
  review_spec_ambiguous: false
auto_merge: true
merge_method: squash
# Where runs execute, and how many at once (queued, running or waiting for CI or review): the only concurrency cap.
runner_pool:
  kind: local # this machine; each run clones its repositories into its own workspace
  max_concurrent_runs: 1
# Harness and model per agent step: rules are "<complexity>.<stage>" with "*" wildcards. Most specific wins:
# a step override, then <complexity>.<stage>, <complexity>.*, *.<stage>, then default. Unset fields fall through.
routing:
  default:
    harness: claude-code
    model: opus # temporarily opus for every step; set back to sonnet to restore the rules below
  rules:
    complex.implement:
      model: opus
    "*.review":
      model: opus
# Step limits (timeout_minutes, max_turns, permission_mode per step kind) keep the SDK's defaults
# (fact.sdk.step_defaults); set `step_defaults.<kind>.<field>` here to override one.
