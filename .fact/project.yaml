name: fact
repositories:
  - full_name: Kahncode/fact
    role: factory
task_source:
  kind: github
  repo: Kahncode/fact
# A task is approved when a person labels its issue `fact:ready`, so no plan approval gate on top of that.
require_plan_approval: false
workflows:
  default: standard
# Before 1.0 fact makes broad breaking changes all the time (AGENTS.md: no backwards compatibility), so no path
# forces a review: schema, API, SDK, workflow and CI changes go through the classify session like any other code,
# and `.fact/prompts/classify.md` tells it they are not high risk or one-way doors. Restore the globs at 1.0.
classify:
  review_spec_ambiguous: false
auto_merge: true
merge_method: squash
