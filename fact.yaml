# fact global settings and project registry. Defaults are written out; override per environment in
# fact.<env>.yaml, or with FACT_* environment variables (nesting with "__", e.g. FACT_TEMPORAL__ADDRESS).
# env comes from FACT_ENV (local, test, dev, prod); default local.
data_dir: ~/.fact
temporal:
  address: localhost:7233
  namespace: default
api:
  host: 127.0.0.1
  port: 8000
# max_runs caps runs queued, running or waiting, all projects together; each project also has its own max_runs.
# In dev (env local, test, dev) the API ticks the scheduler every scheduler_interval_seconds, on at every API start
# (`fact scheduler on|off`); elsewhere only POST /api/v1/scheduler/tick (an outside cron or webhook) runs a tick.
concurrency:
  sandboxes: 2
  planners: 1
  max_runs: 2
  scheduler_interval_seconds: 30
  max_failed_runs: 3 # the scheduler stops restarting a task after this many failed runs in a row; `fact run` resets
# The scheduler starts no run while a Claude usage window is inside its reserve (the share left to you). The gate
# is off with usage_gate: false, or when ANTHROPIC_API_KEY is set for the API (API billing, no windows).
claude:
  usage_gate: true
  reserve:
    five_hour: 0.10
    weekly: 0.05 # seven_day, seven_day_opus and seven_day_sonnet
worker:
  keep_awake: true # Windows: no sleep while a run is queued, running or waiting
projects:
  - name: fact
    home: Kahncode/fact
    path: .
    max_runs: 1 # one run per repository while git hooks are shared by every worktree (docs/decisions-2.md)
# Harness and model per agent step: rules are "<complexity>.<stage>" with "*" wildcards. Most specific wins:
# a step override, then <complexity>.<stage>, <complexity>.*, *.<stage>, then default. Unset fields fall through.
routing:
  default:
    harness: claude-code
    model: opus # temporarily opus for every step; set back to sonnet to restore the rules below
  rules:
    complex.implement:
      model: opus
    "*.review":
      model: opus
# Limits per step kind: timeout_minutes is the activity's start-to-close timeout; max_turns caps agent turns;
# permission_mode is the agent harness's mode (Claude Code: auto keeps checks on without prompting anyone).
step_defaults:
  agent:
    timeout_minutes: 60
    max_turns: 100
    permission_mode: auto
  shell:
    timeout_minutes: 15
