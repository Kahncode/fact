# The `fact dev` config: factory settings (this machine, its processes, scheduler policy, agent accounts) and the
# registry of projects. How a project's tasks run (routing, step limits, its runner pool and how many runs it takes at
# once) is project config, in its home repository's .fact/project.yaml; fact's own is .fact/project.yaml here.
# Override chain, lowest to highest: code defaults, this file, fact.<env>.yaml, .env, FACT_* environment variables
# (nesting with "__", e.g. FACT_CONCURRENCY__MAX_FAILED_RUNS). env comes from FACT_ENV (local, test, dev, prod); default
# local. FACT_CONFIG points at another fact.yaml.
data_dir: ~/.fact
temporal:
  address: localhost:7233
  namespace: default
api:
  host: 127.0.0.1
  port: 8000
# In dev (env local, test, dev) the API ticks the scheduler every scheduler_interval_seconds, on at every API start
# (`fact scheduler on|off`); elsewhere only POST /api/v1/scheduler/tick (an outside cron or webhook) runs a tick.
concurrency:
  scheduler_interval_seconds: 30
  listing_max_age_seconds: 600 # a tick reads a project's ready tasks again past this age, or once a new urgent one shows
  max_failed_runs: 3 # the scheduler stops restarting a task after this many failed runs in a row; `fact run` resets
# The scheduler starts no run while a Claude usage window is inside its reserve (the share left to you). The gate
# is off with usage_gate: false, or when ANTHROPIC_API_KEY is set for the API (API billing, no windows).
claude:
  usage_gate: true
  reserve:
    five_hour: 0.10
    weekly: 0.05 # seven_day, seven_day_opus and seven_day_sonnet
worker:
  keep_awake: true # Windows: no sleep while a run is queued, running or waiting
projects:
  - name: fact
    home: Kahncode/fact
    path: .
