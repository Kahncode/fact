[project]
name = "fact-api"
version = "0.1.0"
description = "fact api package"
requires-python = ">=3.15"
dependencies = [
    "fact-core",
    "fastapi[standard]",
    "temporalio>=1.36.1",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact"]

[tool.uv.sources]
fact-core = { workspace = true }
