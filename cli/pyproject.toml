[project]
name = "fact-cli"
version = "0.1.0"
description = "fact cli package"
requires-python = ">=3.15"
dependencies = [
    "fact-core",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "temporalio>=1.36.1",
    "typer>=0.29.2",
]

[project.scripts]
fact = "fact.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact"]

[tool.uv.sources]
fact-core = { workspace = true }
