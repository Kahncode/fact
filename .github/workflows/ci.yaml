name: CI

on:
  push:
    branches: [main]
    # Planning pushes spec changes straight to main; docs-only pushes need no checks. PRs always run CI.
    paths-ignore: ["docs/**", "*.md", "tasks/README.md", "tasks/backlog.md"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # PRs gate on Linux only, so runs merge without waiting for the slower Windows job; Windows runs on main
        # (and by hand), so a Windows break shows as a red main before anyone pins it with `fact use main`.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      # pytest-timeout fails a single deadlocked test after 60 s (pyproject.toml); this caps anything it misses,
      # which otherwise runs until GitHub's 6 h job limit. The full suite takes about 5 min.
      - run: uv run pytest
        timeout-minutes: 20
